<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Yuru Scouts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="container">
        <div class="navbar-brand">
          <a class="navbar-item" href="/index.html"><strong>Yuru Scouts</strong></a>

          <button type="button" class="navbar-burger" data-target="navbarMenu">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>

        <div id="navbarMenu" class="navbar-menu">
          <div class="navbar-start">
            <a class="navbar-item is-active" href="/index.html">Home</a>
            <a class="navbar-item" href="#">About</a>
            <!-- TODO: point to your repo or contribution form -->
            <a class="navbar-item" href="#">Contribute</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Hero -->
    <header class="hero">
      <div class="hero-body">
        <div class="container">
          <h1 class="title">Welcome to the Yuru Scouts!</h1>
          <p class="subtitle">
            A collaborative project to list all the real-life locations from the
            Yuru Camp series.
          </p>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main>
      <section class="section" id="season1">
        <div class="container">
          <h2 class="title">Anime Season 1</h2>
          <div class="columns" id="season1-container">
            <p class="empty-state">Loading...</p>
          </div>
        </div>
      </section>

      <section class="section" id="season2">
        <div class="container">
          <h2 class="title">Anime Season 2</h2>
          <div class="columns" id="season2-container">
            <p class="empty-state">Loading...</p>
          </div>
        </div>
      </section>

      <section class="section" id="season3">
        <div class="container">
          <h2 class="title">Anime Season 3</h2>
          <div class="columns" id="season3-container">
            <p class="empty-state">Loading...</p>
          </div>
        </div>
      </section>

      <section class="section" id="manga">
        <div class="container">
          <h2 class="title">Manga</h2>
          <div class="columns" id="manga-container">
            <p class="empty-state">Loading...</p>
          </div>
        </div>
      </section>

      <section class="section" id="other">
        <div class="container">
          <h2 class="title">Other Trips</h2>
          <div class="columns" id="other-container">
            <p class="empty-state">Loading...</p>
          </div>
        </div>
      </section>

      <noscript>
        <div class="container">
          <p class="has-text-danger">Locations are loaded with JavaScript. Please enable it to see the list.</p>
        </div>
      </noscript>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>© <span id="year">2026</span> Yuru Scouts.</p>
      </div>
    </footer>

    <script src="/assets/js/script.js" defer></script>
  </body>
</html>
